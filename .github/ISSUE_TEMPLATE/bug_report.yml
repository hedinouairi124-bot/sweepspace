name: Bug report
description: Something in Sweepspace doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project folder
        2. Start Claude Code
        3. ...
  - type: input
    id: version
    attributes:
      label: Sweepspace version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: input
    id: agent
    attributes:
      label: Which agent, if any?
      placeholder: "Claude Code, Codex, Gemini CLI, ..."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Please remove anything private first.
